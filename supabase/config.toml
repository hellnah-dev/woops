# Supabase CLI configuration (used by `supabase start` / `supabase db push` /
# `supabase functions deploy`). Hosted project settings (redirect URLs,
# providers) must ALSO be set in the Supabase dashboard; see README.
project_id = "woops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "com.woops.app://login-callback"
additional_redirect_urls = ["com.woops.app://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# The app calls this with the user's JWT.
[functions.delete-account]
verify_jwt = true

# Called by Database Webhooks, authenticated by the x-webhook-secret header.
[functions.push-notify]
verify_jwt = false

# Called by Google (AdMob server-side verification); authenticated by Google's signature.
[functions.admob-ssv]
verify_jwt = false

# Called by Database Webhooks, authenticated by the x-webhook-secret header.
[functions.admin-alerts]
verify_jwt = false

[functions.cleanup-proofs]
# Called by the daily schedule with x-cleanup-secret (see schedule_cleanup.sql).
verify_jwt = false
